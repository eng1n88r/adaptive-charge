[package]
name = "adaptive-charge"
version = "1.0.0"
edition = "2021"
description = "Event-driven adaptive battery charge ceiling (learns your unplug schedule)"

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
zbus = "5"

[profile.release]
lto = true
strip = true
